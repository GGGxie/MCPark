# MCPark 系统配置文件
app:
  name: "MCPark System"
  version: "1.0.0"
  mode: "debug" # debug, release
  port: 8080

# 数据库配置
database:
  # 数据库类型: sqlite, mysql
  type: "sqlite"

  # SQLite 配置 (默认)
  sqlite:
    path: "./data/MCPark.db"

  # MySQL 配置
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: ""
    database: "MCPark"
    charset: "utf8mb4"
    parseTime: true
    loc: "Local"

# 日志配置
log:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, file
  file: "./logs/app.log"

# 服务器配置
server:
  readTimeout: 30
  writeTimeout: 30
  staticPath: "./static"

# 跨域配置
cors:
  allowOrigins: ["*"]
  allowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowHeaders: ["*"]
