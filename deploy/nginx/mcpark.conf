# MCPark 项目 - Nginx 配置
# 代理后端 API 和前端静态资源

server {
    listen       8085;
    server_name  localhost;

    # 日志
    access_log  /var/log/nginx/mcpark_access.log  main;
    error_log   /var/log/nginx/mcpark_error.log;

    # 前端静态资源
    root /root/Document/MCPark/frontend/dist;
    index index.html index.htm;

    # 请求体上限与基础安全头（见 snippets/edge-security-headers.conf）
    client_max_body_size 256k;
    include snippets/edge-security-headers.conf;

    # 后端 API 代理 (Backend 运行在 8086 端口)
    location /api/ {
        limit_req zone=edge_api burst=30 nodelay;
        limit_req zone=edge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8086/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 前端路由 - SPA 支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/edge-security-headers.conf;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";
}
