# 公网入口的通用限流定义（SkillsHub / MCPark 使用）。
# Cloudflare Tunnel 把所有请求都从 127.0.0.1 转进来，真实客户端 IP 在 CF-Connecting-IP；
# 没有这个头时（本机直连，如 works 的探活）退回 $remote_addr。
map $http_cf_connecting_ip $edge_client_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# 只有 /api/auth/ 进入更严格的登录限流桶；key 为空的请求 nginx 不计数。
map $uri $edge_auth_key {
    ~^/api/auth/ $edge_client_key;
    default      "";
}

limit_req_zone $edge_client_key zone=edge_api:10m  rate=10r/s;
limit_req_zone $edge_auth_key   zone=edge_auth:10m rate=30r/m;
limit_req_status 429;
