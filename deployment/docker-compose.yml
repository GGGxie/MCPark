version: '3.8'

services:
  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: mcp-info-backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data:/app/data
      - ../backend/configs:/app/configs
    environment:
      - GIN_MODE=release
      - PORT=8080
      - LISTEN_ADDR=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (at least 32 characters)}
      - CONFIG_PATH=/app/configs/config.yaml
    restart: unless-stopped
    networks:
      - mcp-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mcp-info-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mcp-network

  nginx:
    image: nginx:alpine
    container_name: mcp-info-nginx
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  data: